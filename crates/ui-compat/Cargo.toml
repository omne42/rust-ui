[package]
name = "ui-compat"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["spectrum"]

# Compatibility shims for external ecosystems (baseline / RAC naming parity).
spectrum = [
    "provider",
    "rac",
    "s2",
    "story_utils",
    "style_macro_s1",
    "test_utils",
    "utils",
]

provider = []
rac = []
s2 = []
story_utils = []
style_macro_s1 = []
test_utils = []
utils = []

[dependencies]
ui-components = { path = "../ui-components" }
ui-headless = { path = "../ui-headless" }

