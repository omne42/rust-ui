[package]
name = "ui-headless"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["web"]
web = ["leptos/csr"]
ssr = ["leptos/ssr"]
logic-calendar = ["dep:ui-logic-calendar"]

[dependencies]
leptos = { version = "0.8.15", default-features = false }
ui-state-primitives = { path = "../ui-state-primitives" }
ui-logic-calendar = { path = "../ui-logic-calendar", optional = true }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.108"
js-sys = "0.3.85"
send_wrapper = "0.6"
web-sys = { version = "0.3.85", features = ["Document", "DomRect", "Element", "EventTarget", "FocusEvent", "HtmlButtonElement", "HtmlDivElement", "HtmlElement", "KeyboardEvent", "Node", "NodeList", "Performance", "PointerEvent", "ResizeObserver", "ResizeObserverEntry", "Window"] }
