ui-tooltip = { path = "../../components/tooltip", optional = true }
ui-toast = { path = "../../components/toast", optional = true }
ui-tree = { path = "../../components/tree", optional = true }
ui-underlay = { path = "../../components/underlay", optional = true }
ui-visually-hidden = { path = "../../components/visually-hidden", optional = true }
ui-layout = { path = "../ui-layout", default-features = false, features = ["inject-css"] }
ui-motion = { path = "../ui-motion" }
ui-observability = { path = "../ui-observability" }
ui-visual-primitive = { path = "../ui-visual-primitive", optional = true }
ui-logic-calendar = { path = "../ui-logic-calendar", optional = true }
ui-state-primitives = { path = "../ui-state-primitives" }
ui-theme = { path = "../ui-theme" }
tracing = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.85"
web-sys = { version = "0.3.85", features = ["DataTransfer", "DragEvent", "File", "FileList", "HtmlInputElement", "ResizeObserver", "ResizeObserverEntry"] }

[dev-dependencies]
tachys = "0.2.11"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(erase_components)"]
