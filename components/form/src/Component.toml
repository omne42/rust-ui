schema_version = "1"

[component]
name = "Form"
crate = "ui-form"
rbi = "form.rbi"

[[inputs]]
name = "children"
ty = "leptos::children::Children"
default = "required"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_read_only"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_required"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "label_position"
ty = "Option<FormLabelPosition>"
default = "None"
controlled = false

[[inputs]]
name = "label_align"
ty = "Option<FormLabelAlign>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-disabled + data-readonly + data-required + data-label-position + data-label-align + data-state-source + aria-disabled + lang + dir"

[[outputs]]
name = "agent-contract"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-stream-mode + data-ui-streaming-policy + data-ui-streaming-fallback + data-ui-output-status + data-ui-state-disabled + data-ui-state-readonly + data-ui-state-required + data-ui-source"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "streaming_optional_with_snapshot_fallback_and_output_status_markers"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[agent_contract]
schema = "ui.form.agent-contract.v1"
intent = "form-container"
action_axis = ["render"]
output_mode_axis = ["streaming", "snapshot"]
stream_support = "optional"
stream_fallback = "snapshot"
output_status = "verified"
state_axes = ["disabled", "read_only", "required"]
source_axes = ["logic_resolved"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.form.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["form-container"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["streaming", "snapshot"]

[[agent_contract_markers]]
name = "streaming_policy"
attr = "data-ui-streaming-policy"
values = ["optional", "required"]

[[agent_contract_markers]]
name = "streaming_fallback"
attr = "data-ui-streaming-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["draft", "verified", "submittable"]

[[agent_contract_markers]]
name = "state_disabled"
attr = "data-ui-state-disabled"
values = ["true", "false"]

[[agent_contract_markers]]
name = "state_read_only"
attr = "data-ui-state-readonly"
values = ["true", "false"]

[[agent_contract_markers]]
name = "state_required"
attr = "data-ui-state-required"
values = ["true", "false"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["logic-resolved"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_logic::resolve_view_state",
  "typed_agent_contract_from_logic::resolve_agent_contract_attrs",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
