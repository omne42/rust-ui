schema_version = "1"

[component]
name = "Drawer"
crate = "ui-drawer"
rbi = "drawer.rbi"

[[inputs]]
name = "is_open"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "on_close"
ty = "Option<ui_headless::OnPress>"
default = "None"
controlled = false

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "title"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "children"
ty = "ChildrenFn"
default = "required"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "footer"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "placement"
ty = "Option<DrawerPlacement>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "DrawerMotion"
default = "DrawerMotion::default()"
controlled = false

[[inputs]]
name = "is_close_button_visible"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "close_label"
ty = "Option<&'static str>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "on_exit_complete"
ty = "Option<Callback<()>>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-state + data-open-* + data-*-source + data-placement + data-description + data-footer + data-close-button + data-custom-* + aria-* + lang + dir"
scope = "root/header/title/description/body/footer/close"

[[outputs]]
name = "open-state-change"
ty = "on_open_change + on_close + on_exit_complete"
scope = "open-state + close-action + exit-action"

[[outputs]]
name = "schema-protocol"
ty = "DrawerComponentSchemaVersion + DrawerComponentSpec"
scope = "protocol.rs"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-config-policy + data-ui-output-status + data-ui-capability-*"
scope = "root"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_open_state"
enabled = true

[[capabilities]]
name = "stable_state_source_markers"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "versioned_protocol_schema"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-primitives"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[dependencies]]
name = "ui-sheet"
kind = "overlay-shell"

[[dependencies]]
name = "ui-button"
kind = "close-action-ui"

[agent_contract]
schema = "ui.drawer.agent-contract.v1"
intent = "overlay.drawer"
action = "open-close"
output_state = "verified"
state_axes = ["open_state"]
source_axes = ["open_mode", "open_action_source"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.drawer.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["overlay.drawer"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["open", "close"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["open", "closed"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["controlled", "uncontrolled"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::drawer::resolve_open_config",
  "typed_agent_contract_from_logic::resolve_agent_contract",
  "typed_render_mount_from_view::render_drawer_root",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
