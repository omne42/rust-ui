schema_version = "1"

[component]
name = "Meter"
crate = "ui-meter"
rbi = "meter.rbi"

[[inputs]]
name = "id"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "value"
ty = "Signal<Option<f64>>"
default = "None"
controlled = true

[[inputs]]
name = "min"
ty = "Option<f64>"
default = "None"
controlled = false

[[inputs]]
name = "max"
ty = "Option<f64>"
default = "None"
controlled = false

[[inputs]]
name = "size"
ty = "MeterSize"
default = "MeterSize::Default"
controlled = false

[[inputs]]
name = "variant"
ty = "MeterVariant"
default = "MeterVariant::Default"
controlled = false

[[inputs]]
name = "motion"
ty = "MeterMotion"
default = "MeterMotion::default()"
controlled = false

[[inputs]]
name = "is_value_label_visible"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "show_value_label"
ty = "Option<bool>"
default = "None (legacy alias)"
controlled = false

[[inputs]]
name = "value_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "role + aria-* + data-slot + data-variant + data-size + data-state"

[[outputs]]
name = "source-markers"
ty = "data-label-source + data-value-label-source + data-motion-source + data-class-source"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "streaming_optional_with_snapshot_fallback"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "reduced_motion_with_non_wasm_noop"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"

[streaming_policy]
required = false
fallback = "snapshot"
owner = "upstream"

[agent_contract]
schema = "ui.meter.agent-contract.v1"
intent = "progress-meter"
action_axis = ["render"]
state_axes = ["phase", "variant", "size"]
source_axes = ["label_source", "value_label_source", "motion_source", "class_source"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.meter.agent-contract.v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["progress-meter"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_mode"
attr = "data-ui-output-mode"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["validated"]

[[agent_contract_markers]]
name = "state_phase"
attr = "data-ui-state-phase"
values = ["determinate", "indeterminate"]

[[agent_contract_markers]]
name = "state_variant"
attr = "data-ui-state-variant"
values = ["default", "danger"]

[[agent_contract_markers]]
name = "state_size"
attr = "data-ui-state-size"
values = ["sm", "default", "lg"]

[[agent_contract_markers]]
name = "source_label"
attr = "data-ui-source-label"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "source_value_label"
attr = "data-ui-source-value-label"
values = ["auto", "custom"]

[[agent_contract_markers]]
name = "source_motion"
attr = "data-ui-source-motion"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "source_class"
attr = "data-ui-source-class"
values = ["default", "custom"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_logic::resolve_state",
  "typed_render_state_from_logic::derive_render_state",
  "typed_agent_contract_from_protocol::agent_data_attrs",
  "view::Meter",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
