schema_version = "1"

[component]
name = "FlipCard"
crate = "ui-flip-card"

[[inputs]]
name = "front"
ty = "ViewFn"
default = "required"
controlled = false

[[inputs]]
name = "back"
ty = "ViewFn"
default = "required"
controlled = false

[[inputs]]
name = "is_flipped"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_is_flipped"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "default_flipped"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_is_flipped_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "flip_mode"
ty = "Option<FlipCardFlipMode>"
default = "None"
controlled = false

[[inputs]]
name = "is_flip_on_hover"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "flip_on_hover"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "FlipCardMotion"
default = "FlipCardMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "id"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-* + aria-* + role + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-*-source + data-ui-config-policy"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_flipped_axis"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[agent_contract]]
schema = "ui.flip-card.agent-contract.v1"
intent = "flip.interaction"
action = "snapshot-render|toggle|hover-enter|hover-leave|focus|blur"
state_axes = ["default", "flipped", "hovered", "disabled"]
source_axes = [
  "state-primitives",
  "flipped-control-mode",
  "flip-mode-source",
  "motion-source",
  "class-source",
  "id-source",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.flip-card.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["flip.interaction"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["snapshot-render", "toggle", "hover-enter", "hover-leave", "focus", "blur"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["default", "flipped", "hovered", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["render_front_face", "render_back_face"]
blocked = ["inner_html", "<script", "javascript:"]
