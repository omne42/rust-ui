schema_version = "1"

[component]
name = "DateInputGroup"
crate = "ui-date-input-group"

[[inputs]]
name = "is_full_width"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "variant"
ty = "DateInputGroupVariant"
default = "DateInputGroupVariant::Primary"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_invalid"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_segmented"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "motion"
ty = "DateInputGroupMotion"
default = "DateInputGroupMotion::default()"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "prefix"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "suffix"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "children"
ty = "Children"
default = "required"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-variant + data-width + data-full-width + data-disabled + data-invalid + data-segmented + data-has-prefix + data-has-suffix + data-aria-source + data-class-source + data-motion-source + data-custom-motion + aria-* + role + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-output-status + data-ui-stream-support + data-ui-stream-fallback + data-ui-stream-mode + data-ui-state-source + data-ui-motion-source + data-ui-aria-source + data-ui-class-source + data-ui-config-policy"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_boundary"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[agent_contract]]
schema = "ui.date-input-group.agent-contract.v1"
intent = "date.input-group"
action = "snapshot-render"
state_axes = ["default", "disabled", "invalid", "segmented"]
source_axes = [
  "state-primitives",
  "data-ui-state-source",
  "data-ui-motion-source",
  "data-ui-aria-source",
  "data-ui-class-source",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.date-input-group.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["date.input-group"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["snapshot-render"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["default", "disabled", "invalid", "segmented"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["unsupported"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[streaming_policy]
term_scope = "llm-output-rendering"
defined_modes = ["streaming", "snapshot"]
required = false
owner = "upstream"
fallback = "snapshot"
default = "snapshot"

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "render_prefix_slot(...)",
  "render_suffix_slot(...)",
  "logic::derive_state(...)",
  "logic::resolve_agent_contract(...)",
  "date_input_group_motion::attach_motion(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]
