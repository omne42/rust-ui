schema_version = "1"

[component]
name = "ColorSwatchPicker"
crate = "ui-color-swatch-picker"

[[inputs]]
name = "swatches"
ty = "ReadSignal<Vec<ColorSwatchPickerItem>>"
default = "required"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "size"
ty = "ColorSwatchSize"
default = "ColorSwatchSize::default()"
controlled = false

[[inputs]]
name = "rounding"
ty = "ColorSwatchRounding"
default = "ColorSwatchRounding::default()"
controlled = false

[[inputs]]
name = "shape"
ty = "ColorSwatchShape"
default = "ColorSwatchShape::default()"
controlled = false

[[inputs]]
name = "is_bordered"
ty = "bool"
default = "true"
controlled = false

[[inputs]]
name = "selected_color"
ty = "Option<Signal<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected_color"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_change"
ty = "Option<Callback<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "id_base"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "ColorSwatchPickerMotion"
default = "ColorSwatchPickerMotion::default()"
controlled = false

[[outputs]]
name = "on_selected_change"
ty = "Callback<Option<String>>"
scope = "component-event"

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-disabled + data-empty + data-has-items + data-count + data-has-selection + data-selection-empty + data-selected-index + data-has-disabled-items + data-disabled-item-count + data-selection-mode + data-selection-init-source + data-selection-source + data-aria-source + data-class-source + data-motion-source + role + aria-* + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status + data-ui-intent + data-ui-action + data-ui-state + data-ui-source"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_selection"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "headless_a11y_contract"
enabled = true

[[capabilities]]
name = "component_motion_contract"
enabled = true

[[capabilities]]
name = "agent-contract-markers"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_boundary"
enabled = true

[[agent_contract]]
schema = "ui.color-swatch-picker.agent-contract.v1"
intent = "pick-color-swatch"
action = "select|sync"
state_axes = ["active", "disabled", "empty"]
source_axes = ["interaction", "external", "default", "internal"]
stream_support = "unsupported"
stream_fallback = "snapshot"

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
source = "logic::resolve_agent_contract().schema_attr"

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
source = "logic::resolve_agent_contract().schema_version_attr"

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
source = "logic::resolve_agent_contract().intent_attr"

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
source = "logic::resolve_ui_action(...).as_attr()"

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
source = "logic::resolve_ui_state(...).as_attr()"

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
source = "logic::resolve_ui_source(...).as_attr()"

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "logic::resolve_agent_contract()",
  "logic::resolve_ui_action(...)",
  "logic::resolve_ui_state(...)",
  "logic::resolve_ui_source(...)",
  "logic::resolve_component_state(...)",
  "motion::sanitize_motion(...)",
  "motion::attach_motion(...)",
  "use_radio(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "motion-driver"

[[dependencies]]
name = "ui-theme"
kind = "token-source"
