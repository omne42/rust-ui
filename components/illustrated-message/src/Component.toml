schema_version = "1"

[component]
name = "IllustratedMessage"
crate = "ui-illustrated-message"
rbi = "illustrated_message.rbi"

[[inputs]]
name = "title"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "illustration"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "actions"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "orientation"
ty = "IllustratedMessageOrientation"
default = "IllustratedMessageOrientation::Vertical"
controlled = false

[[inputs]]
name = "motion"
ty = "IllustratedMessageMotion"
default = "IllustratedMessageMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::a11y::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-view-state + data-content-state + data-title-state + data-description-state + data-illustration-state + data-actions-state + data-title-source + data-description-source + data-illustration-source + data-actions-source + data-orientation + aria-live + lang + dir"
scope = "root-attributes"

[[outputs]]
name = "agent-contract-schema"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-config-policy + data-ui-streaming-policy + data-ui-streaming-fallback + data-ui-output-status"
scope = "root-attributes"

[[slots]]
name = "illustration"
required = false
description = "Optional slot rendered in the illustration container."

[[slots]]
name = "actions"
required = false
description = "Optional slot rendered in the actions container."

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[capabilities]]
name = "streaming_optional_with_snapshot_fallback_and_output_status_markers"
enabled = true

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-contract"

[[dependencies]]
name = "ui-motion"
kind = "motion-runtime"

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[agent_contract]
schema = "ui.illustrated-message.agent-contract.v1"
intent = "empty-state-display"
output_mode_axis = ["snapshot"]
action_axis = ["render-snapshot"]
state_axes = ["view_state"]
source_axes = ["content_source"]

[[agent_contract_markers]]
name = "schema_name"
attr = "data-ui-schema"
values = ["ui.illustrated-message.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["empty-state-display"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render-snapshot"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["empty", "populated"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_markers]]
name = "streaming_policy"
attr = "data-ui-streaming-policy"
values = ["optional"]

[[agent_contract_markers]]
name = "streaming_fallback"
attr = "data-ui-streaming-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["validated"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::illustrated_message::resolve_view_state",
  "typed_agent_contract_from_logic::resolve_agent_contract_attrs",
  "typed_render_mount_from_view",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
