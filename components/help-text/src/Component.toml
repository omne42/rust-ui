schema_version = "1"

[component]
name = "HelpText"
crate = "ui-help-text"

[[inputs]]
name = "tone"
ty = "HelpTextTone"
default = "HelpTextTone::default()"
controlled = false

[[inputs]]
name = "is_invalid"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_error_icon_visible"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "error_message"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "HelpTextMotion"
default = "HelpTextMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-tone + data-state + data-message-kind + data-invalid + data-disabled + data-show-error-icon + data-has-description + data-has-error + data-aria-source + data-error-source + data-custom-class + data-class-source + data-motion-source + data-custom-motion + aria-label + aria-invalid + aria-disabled + lang + dir"

[[outputs]]
name = "agent-contract"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-stream-support + data-ui-stream-mode + data-ui-stream-fallback + data-ui-output-status"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "motion_contract_with_non_wasm_noop"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "structured_state_markers"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"

[agent_contract]
schema = "ui.help-text.agent-contract.v1"
intent = "form-assistance"
output_mode_axis = ["snapshot"]
action_axis = ["announce-error", "read-only"]
state_axes = ["data_state"]
source_axes = ["aria_source", "error_source"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.help-text.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["form-assistance"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["announce-error", "read-only"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::help_text::resolve_state",
  "typed_semantics_from_logic::resolve_agent_contract_attrs",
  "typed_render_mount_from_view",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
