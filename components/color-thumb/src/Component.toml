schema_version = "1"

[component]
name = "ColorThumb"
crate = "ui-color-thumb"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "color"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_focused"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_dragging"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "x_percent"
ty = "Option<f32>"
default = "None"
controlled = false

[[inputs]]
name = "y_percent"
ty = "Option<f32>"
default = "None"
controlled = false

[[inputs]]
name = "is_loupe_visible"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "ColorThumbMotion"
default = "ColorThumbMotion::default()"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_value_text"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-disabled + data-focused + data-dragging + data-loupe-visible + data-has-color + data-x + data-y + data-x-bucket + data-y-bucket + data-interaction-source + data-aria-source + data-aria-valuetext-source + data-custom-class + data-class-source + data-loupe-source + data-x-source + data-y-source + data-motion-source + data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status + role + aria-* + lang + dir"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "headless_a11y_contract"
enabled = true

[[capabilities]]
name = "component_motion_contract"
enabled = true

[[capabilities]]
name = "agent-contract-markers"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[agent_contract]]
schema = "ui.color-thumb.agent-contract.v1"
schema_version = "1"
intent = "pick-color-point"
action = "idle|focus|drag"
stream_support = "optional"
stream_fallback = "snapshot"
output_status = "verified"
state_attr = "data-ui-state"
source_attr = "data-ui-source"

[[agent_contract_markers]]
attr = "data-ui-schema"
source = "logic::resolve_agent_contract().schema_attr"

[[agent_contract_markers]]
attr = "data-ui-schema-version"
source = "logic::resolve_agent_contract().schema_version_attr"

[[agent_contract_markers]]
attr = "data-ui-intent"
source = "logic::resolve_agent_contract().intent_attr"

[[agent_contract_markers]]
attr = "data-ui-action"
source = "logic::resolve_ui_action(state)"

[[agent_contract_markers]]
attr = "data-ui-state"
source = "semantics.root_attrs.data_state"

[[agent_contract_markers]]
attr = "data-ui-source"
source = "semantics.root_attrs.data_interaction_source"

[[agent_contract_markers]]
attr = "data-ui-stream-support"
source = "logic::resolve_agent_contract().stream_support_attr"

[[agent_contract_markers]]
attr = "data-ui-stream-fallback"
source = "logic::resolve_agent_contract().stream_fallback_attr"

[[agent_contract_markers]]
attr = "data-ui-output-status"
source = "logic::resolve_agent_contract().output_status_attr"

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "logic::resolve_component_state(...)",
  "logic::resolve_agent_contract()",
  "logic::resolve_ui_action(...)",
  "use_color_thumb(...)",
  "motion::sanitize_motion(...)",
  "motion::attach_motion(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "motion-driver"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"
