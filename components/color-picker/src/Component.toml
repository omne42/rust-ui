schema_version = "1"

[component]
name = "ColorPicker"
crate = "ui-color-picker"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "children"
ty = "ChildrenFn"
default = "required"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "value"
ty = "Option<Signal<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_value"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "on_value_change"
ty = "Option<Callback<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "selected_color"
ty = "Option<Signal<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected_color"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_change"
ty = "Option<Callback<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "open"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "motion"
ty = "ColorPickerMotion"
default = "ColorPickerMotion::default()"
controlled = false

[[inputs]]
name = "placement"
ty = "ui_headless::PopoverPlacement"
default = "PopoverPlacement::default()"
controlled = false

[[inputs]]
name = "swatch_size"
ty = "ColorSwatchSize"
default = "ColorSwatchSize::default()"
controlled = false

[[inputs]]
name = "swatch_rounding"
ty = "ColorSwatchRounding"
default = "ColorSwatchRounding::default()"
controlled = false

[[inputs]]
name = "swatch_shape"
ty = "ColorSwatchShape"
default = "ColorSwatchShape::default()"
controlled = false

[[inputs]]
name = "swatch_bordered"
ty = "bool"
default = "true"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-open + data-disabled + data-has-selection + data-selection-empty + data-open-mode + data-label-source + data-aria-source + data-class-source + data-motion-source + role + aria-* + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-output-status + data-ui-stream-support + data-ui-stream-fallback + data-ui-stream-mode + data-ui-selection-source + data-ui-open-source + data-ui-motion-source + data-ui-label-source + data-ui-aria-source + data-ui-class-source + data-ui-config-policy"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_selection_and_open"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_boundary"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "ui-color-swatch"
kind = "composed-control"

[[dependencies]]
name = "ui-popover"
kind = "composed-overlay"

[[agent_contract]]
schema = "ui.color-picker.agent-contract.v1"
intent = "color.selection"
action = "snapshot-render|toggle-open|toggle-close"
state_axes = ["disabled", "open", "selected", "empty"]
source_axes = [
  "state-primitives",
  "data-ui-selection-source",
  "data-ui-open-source",
  "data-ui-motion-source",
  "data-ui-label-source",
  "data-ui-aria-source",
  "data-ui-class-source",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.color-picker.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["color.selection"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["snapshot-render", "toggle-open", "toggle-close"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["disabled", "open", "selected", "empty"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "render_empty_swatch(...)",
  "render_selected_swatch(...)",
  "render_selected_value_text(...)",
  "render_trigger()",
  "render_panel()",
  "logic::resolve_derived_state(...)",
  "logic::resolve_agent_contract(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]
