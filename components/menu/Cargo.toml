[package]
name = "ui-menu"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
component-menu = []
component-menu_item = []
component-menu_section = []

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
ui = { path = "../../crates/ui", default-features = false, features = ["component-button", "component-popover"] }
ui-headless = { path = "../../crates/ui-headless" }
ui-motion = { path = "../../crates/ui-motion" }
ui-observability = { path = "../../crates/ui-observability" }
ui-state-primitives = { path = "../../crates/ui-state-primitives" }
ui-visual-primitive = { path = "../../crates/ui-visual-primitive" }
serde = { version = "1.0", features = ["derive"] }
