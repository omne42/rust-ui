schema_version = "1"

[component]
name = "ErrorView"
crate = "ui-error-view"

[[inputs]]
name = "is_invalid"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "tone"
ty = "Option<ErrorViewTone>"
default = "None"
controlled = false

[[inputs]]
name = "is_compact"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_bordered"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "ErrorViewMotion"
default = "ErrorViewMotion::default()"
controlled = false

[[inputs]]
name = "message"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "icon"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "actions"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "children"
ty = "Option<Children>"
default = "None"
controlled = false

[[outputs]]
name = "data-state"
ty = "visible | hidden"
scope = "root-attribute"

[[outputs]]
name = "data-tone"
ty = "neutral | negative"
scope = "root-attribute"

[[outputs]]
name = "data-tone-source"
ty = "prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-compact-source"
ty = "is-prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-bordered-source"
ty = "is-prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-message-source"
ty = "prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-aria-source"
ty = "prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-class-source"
ty = "prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-motion-source"
ty = "custom | default"
scope = "root-attribute"

[[outputs]]
name = "data-ui-schema"
ty = "ui.error-view.agent-contract"
scope = "root-attribute"

[[outputs]]
name = "data-ui-schema-version"
ty = "v1"
scope = "root-attribute"

[[outputs]]
name = "data-ui-intent"
ty = "error.feedback"
scope = "root-attribute"

[[outputs]]
name = "data-ui-action"
ty = "announce-only | announce-with-actions"
scope = "root-attribute"

[[outputs]]
name = "data-ui-state"
ty = "visible | hidden"
scope = "root-attribute"

[[outputs]]
name = "data-ui-source"
ty = "default | custom"
scope = "root-attribute"

[[outputs]]
name = "data-ui-state-source"
ty = "is-invalid-prop"
scope = "root-attribute"

[[outputs]]
name = "data-ui-action-source"
ty = "message-only | actions-slot"
scope = "root-attribute"

[[outputs]]
name = "data-ui-motion-source"
ty = "default | custom"
scope = "root-attribute"

[[outputs]]
name = "data-ui-config-policy"
ty = "whitelist"
scope = "root-attribute"

[[outputs]]
name = "role"
ty = "alert"
scope = "root-attribute"

[[outputs]]
name = "aria-live"
ty = "assertive | off"
scope = "root-attribute"

[[outputs]]
name = "aria-hidden"
ty = "true | absent"
scope = "root-attribute"

[[capabilities]]
name = "display_only_error_feedback_surface"
enabled = true

[[capabilities]]
name = "source_markers_for_state_and_defaults"
enabled = true

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_typed_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[agent_contract_markers]]
name = "schema"
schema = "ui.error-view.agent-contract.v1"

[[agent_contract_markers]]
name = "schema_name"
attr = "data-ui-schema"
values = ["ui.error-view.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["error.feedback"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["announce-only", "announce-with-actions"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["visible", "hidden"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["render_content", "render_icon", "render_actions"]
blocked = ["inner_html", "<script", "javascript:"]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-contract"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"
