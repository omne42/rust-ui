schema_version = "1"

[component]
name = "List"
crate = "ui-list"

[[inputs]]
name = "id_base"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "items"
ty = "Arc<[String]>"
default = "required"
controlled = false

[[inputs]]
name = "selected_index"
ty = "Option<Signal<Option<usize>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected_index"
ty = "Option<usize>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_index_change"
ty = "Option<Callback<Option<usize>>>"
default = "None"
controlled = false

[[inputs]]
name = "id"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_labelledby"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "disabled_indices"
ty = "Vec<usize>"
default = "[]"
controlled = false

[[inputs]]
name = "on_action"
ty = "Option<Callback<usize>>"
default = "None"
controlled = false

[[inputs]]
name = "default_active_index"
ty = "usize"
default = "0"
controlled = false

[[inputs]]
name = "is_active_index_synced_to_selected"
ty = "bool"
default = "true"
controlled = false

[[inputs]]
name = "motion"
ty = "ListMotion"
default = "ListMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-state + data-selection-mode + data-selection-value-source + data-default-selection-source + data-selection-change-source + data-interaction-source + data-motion-source + aria-* + role + lang + dir"
scope = "root-attribute"

[[outputs]]
name = "agent-contract-schema"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status + data-ui-config-policy"
scope = "root-attribute"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-and-interaction"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[agent_contract]
schema = "ui.list.agent-contract"
intent = "collection.selection"
action = "navigate.select"
state_axes = ["empty", "selection-empty", "has-selection", "disabled"]
source_axes = ["controlled", "uncontrolled"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.list.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["collection.selection"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["navigate.select"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["empty", "selection-empty", "has-selection", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["controlled", "uncontrolled"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["optional"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::list::resolve_view_state",
  "typed_agent_contract_from_logic::resolve_agent_contract",
  "typed_render_mount_from_view",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
