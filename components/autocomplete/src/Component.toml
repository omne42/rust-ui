schema_version = "1"

[component]
name = "Autocomplete"
crate = "ui-autocomplete"
rbi = "autocomplete.rbi"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "label"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "items"
ty = "Vec<String>"
default = "required"
controlled = false

[[inputs]]
name = "selected_index"
ty = "Option<Signal<Option<usize>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected_index"
ty = "Option<usize>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_index_change"
ty = "Option<Callback<Option<usize>>>"
default = "None"
controlled = true

[[inputs]]
name = "set_selected_index"
ty = "Option<WriteSignal<Option<usize>>>"
default = "None"
controlled = true

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "disabled_indices"
ty = "Vec<usize>"
default = "[]"
controlled = false

[[inputs]]
name = "is_required"
ty = "Option<Signal<bool>>"
default = "None"
controlled = false

[[inputs]]
name = "required"
ty = "Option<Signal<bool>>"
default = "None"
controlled = false

[[inputs]]
name = "is_invalid"
ty = "Option<Signal<bool>>"
default = "None"
controlled = false

[[inputs]]
name = "invalid"
ty = "Option<Signal<bool>>"
default = "None"
controlled = false

[[inputs]]
name = "aria_describedby"
ty = "Signal<Option<String>>"
default = "Signal::derive(|| None)"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "error"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "placeholder"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "empty_message"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_open"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "open"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "AutocompleteMotion"
default = "AutocompleteMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-open + data-disabled + data-controlled + data-*-source + data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-output-status + data-ui-stream-support + data-ui-stream-fallback + data-ui-stream-mode + data-ui-state-source + data-ui-motion-source + data-ui-selected-source + data-ui-selected-change-source + data-ui-open-value-source + data-ui-config-policy + role + aria-* + lang + dir"
scope = "root-attribute"

[[outputs]]
name = "on_open_change"
ty = "Callback<bool>"
scope = "event"

[[capabilities]]
name = "controlled_and_uncontrolled_open_state"
enabled = true

[[capabilities]]
name = "source_markers_for_state_and_custom_inputs"
enabled = true

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_boundary"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-and-interaction"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-visual-primitive"
kind = "active-highlight-motion"

[[checks]]
name = "agent_contract_schema_markers"
by = "crates/ui-components/tests/autocomplete_semantics.rs::autocomplete_agent_contract_is_schema_typed_and_machine_readable"

[[checks]]
name = "agent_contract_whitelist_boundary"
by = "crates/ui-components/tests/autocomplete_semantics.rs::autocomplete_agent_contract_render_path_is_whitelist_safe_and_script_injection_free"

[[agent_contract]]
schema = "ui.autocomplete.agent-contract.v1"
intent = "autocomplete.suggest-and-select"
action = "idle|query|commit-selection"
state_axes = ["open", "closed", "disabled"]
source_axes = [
  "state-primitives",
  "data-ui-state-source",
  "data-ui-motion-source",
  "data-ui-selected-source",
  "data-ui-selected-change-source",
  "data-ui-open-value-source",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.autocomplete.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["autocomplete.suggest-and-select"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["idle", "query", "commit-selection"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["open", "closed", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["unsupported"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["snapshot"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::autocomplete::resolve_state",
  "typed_semantics_from_logic::resolve_agent_contract",
  "typed_render_mount_from_view",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
  "eval(",
]

[streaming_policy]
term_scope = "llm-output-rendering"
defined_modes = ["streaming", "snapshot"]
required = false
owner = "upstream"
fallback = "snapshot"
default = "snapshot"
