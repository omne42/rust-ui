schema_version = "1"

[component]
name = "Icon"
crate = "ui-icon"
rbi = "icon.rbi"

[[exports]]
name = "Icon"
kind = "component"

[[exports]]
name = "Icons"
kind = "component"

[[exports]]
name = "Iconset"
kind = "component"

[[exports]]
name = "IconsUi"
kind = "component"

[[exports]]
name = "IconsWorkflow"
kind = "component"

[[inputs]]
name = "size"
ty = "IconSize"
default = "IconSize::Md"
controlled = false

[[inputs]]
name = "tone"
ty = "IconTone"
default = "IconTone::Default"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_decorative"
ty = "bool"
default = "true"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "iconset_registry"
ty = "Vec<IconsetGlyph>"
default = "[]"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "role + aria-* + data-slot + data-state + data-size + data-tone + data-*-source + lang + dir"
scope = "root-attribute"

[[outputs]]
name = "registry-resolution-markers"
ty = "data-icon-source + data-iconset-source + data-label-source + data-glyph-source"
scope = "root-attribute"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source"
scope = "root-attribute"

[[outputs]]
name = "streaming-policy-markers"
ty = "data-ui-streaming + data-ui-streaming-fallback + data-ui-output-mode + data-ui-output-status"
scope = "root-attribute"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "streaming_optional_with_snapshot_fallback"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "icon_registry_projection"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"

[agent_contract]
schema = "ui.icon.agent-contract.v1"
intent = "display.icon.family"
action_axis = ["render"]
state_axes = ["size", "tone", "state", "decorative", "disabled"]
source_axes = ["source"]

[streaming_policy]
streaming = "optional"
fallback = "snapshot"
output_mode = "snapshot"
output_status = "verified"

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.icon.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = [
  "display.icon.render",
  "display.icons.resolve",
  "display.iconset.resolve",
  "display.icons-ui.resolve",
  "display.icons-workflow.resolve",
]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["default", "labeled", "disabled", "decorative", "fallback"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["default", "custom", "prop", "name", "icon", "registry", "fallback", "explicit", "prefixed"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "logic::resolve_state",
  "logic::compose_class_name",
  "view::Icon",
  "view::Icons",
  "view::Iconset",
  "view::IconsUi",
  "view::IconsWorkflow",
]
blocked = ["inner_html", "dangerously_set_inner_html", "<script", "javascript:"]
