schema_version = "1"

[component]
name = "NativeSelect"
crate = "ui-native-select"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "options"
ty = "Vec<NativeSelectOption>"
default = "required"
controlled = false

[[inputs]]
name = "selected_index"
ty = "Option<Signal<Option<usize>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected_index"
ty = "Option<usize>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_index_change"
ty = "Option<Callback<Option<usize>>>"
default = "None"
controlled = true

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_required"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_invalid"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "size"
ty = "NativeSelectSize"
default = "NativeSelectSize::Md"
controlled = false

[[inputs]]
name = "name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "placeholder"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-* + aria-* + lang + dir + data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-config-policy + data-streaming-mode + data-streaming-fallback + data-output-status"
scope = "root-and-control-attributes"

[[outputs]]
name = "on_selected_index_change"
ty = "Callback<Option<usize>>"
scope = "event"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "streaming_optional_fallback_snapshot"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[agent_contract]]
schema = "ui.native_select.agent-contract.v1"
intent = "selection.choose"
action = "idle|user-select|external-sync|internal-sync|sync-effect|disabled"
state_axes = ["empty", "selected", "disabled"]
source_axes = ["external", "default", "internal"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.native_select.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["selection.choose"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["idle", "user-select", "external-sync", "internal-sync", "sync-effect", "disabled"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["empty", "selected", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["external", "default", "internal"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "render_placeholder_option",
  "render_native_select_option",
  "render_static_indicator",
  "use_native_select",
  "resolve_agent_contract",
]
blocked = ["inner_html", "dangerously_set_inner_html", "<script", "javascript:"]
