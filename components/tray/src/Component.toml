schema_version = "1"

[component]
name = "Tray"
crate = "ui-tray"

[[inputs]]
name = "is_open"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<leptos::prelude::Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "on_close"
ty = "Option<ui_headless::OnPress>"
default = "None"
controlled = false

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "title"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "children"
ty = "leptos::children::ChildrenFn"
default = "required"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "footer"
ty = "Option<leptos::children::ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "Option<TrayMotion>"
default = "None"
controlled = false

[[inputs]]
name = "is_show_close_button"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "close_label"
ty = "Option<&'static str>"
default = "None"
controlled = false

[[inputs]]
name = "is_fixed_height"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_dismissable"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_keyboard_dismiss_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "on_exit_complete"
ty = "Option<leptos::prelude::Callback<()>>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-state + data-open + data-closed + data-open-source + data-description + data-footer + data-close-button + data-*-source + aria-* + lang + dir"
scope = "tray-root/header/title/description/body/footer/close"

[[outputs]]
name = "on_close"
ty = "ui_headless::OnPress"
scope = "tray-dismiss"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "sheet_composition"
enabled = true

[[capabilities]]
name = "overlay_dialog_a11y_attrs"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-primitive"

[[dependencies]]
name = "ui/sheet"
kind = "overlay-shell"
