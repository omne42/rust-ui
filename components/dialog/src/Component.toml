schema_version = "1"

[component]
name = "Dialog"
crate = "ui-dialog"
rbi = "dialog.rbi"

[[inputs]]
name = "is_open"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "open"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<leptos::prelude::Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "on_close"
ty = "Option<crate::OnPress>"
default = "None"
controlled = false

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "title"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "footer"
ty = "Option<leptos::children::ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "size"
ty = "DialogSize"
default = "DialogSize::Md"
controlled = false

[[inputs]]
name = "is_close_button_visible"
ty = "bool"
default = "true"
controlled = false

[[inputs]]
name = "show_close_button"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "close_label"
ty = "&'static str"
default = "\"Close\""
controlled = false

[[inputs]]
name = "motion"
ty = "DialogMotion"
default = "DialogMotion::default()"
controlled = false

[[inputs]]
name = "on_exit_complete"
ty = "Option<leptos::prelude::Callback<()>>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "data-state"
ty = "with-description | without-description"
scope = "root-attribute"

[[outputs]]
name = "data-open-mode"
ty = "controlled | uncontrolled"
scope = "root-attribute"

[[outputs]]
name = "data-open-source"
ty = "controlled | uncontrolled"
scope = "root-attribute"

[[outputs]]
name = "data-open-change-source"
ty = "prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-size"
ty = "sm | md | lg"
scope = "root-attribute"

[[outputs]]
name = "data-description"
ty = "with-description | without-description"
scope = "root-attribute"

[[outputs]]
name = "data-footer"
ty = "with-footer | without-footer"
scope = "root-attribute"

[[outputs]]
name = "data-close-button"
ty = "visible | hidden"
scope = "root-attribute"

[[outputs]]
name = "data-ui-schema"
ty = "ui.dialog.agent-contract"
scope = "root-attribute"

[[outputs]]
name = "data-ui-schema-version"
ty = "v1"
scope = "root-attribute"

[[outputs]]
name = "data-ui-intent"
ty = "overlay.interaction"
scope = "root-attribute"

[[outputs]]
name = "data-ui-action"
ty = "open-close"
scope = "root-attribute"

[[outputs]]
name = "data-ui-state"
ty = "open | closed"
scope = "root-attribute"

[[outputs]]
name = "data-ui-source"
ty = "controlled | uncontrolled"
scope = "root-attribute"

[[outputs]]
name = "data-ui-open-change-source"
ty = "prop | default"
scope = "root-attribute"

[[outputs]]
name = "data-ui-config-policy"
ty = "whitelist"
scope = "root-attribute"

[[outputs]]
name = "data-ui-stream-support"
ty = "required | optional"
scope = "root-attribute"

[[outputs]]
name = "data-stream-mode"
ty = "streaming | snapshot"
scope = "root-attribute"

[[outputs]]
name = "data-stream-fallback"
ty = "streaming | snapshot"
scope = "root-attribute"

[[outputs]]
name = "data-output-status"
ty = "draft | verified | commit-ready"
scope = "root-attribute"

[[outputs]]
name = "role"
ty = "dialog"
scope = "overlay-root"

[[outputs]]
name = "aria-modal"
ty = "true"
scope = "overlay-root"

[[capabilities]]
name = "controlled_and_uncontrolled_open_state"
enabled = true

[[capabilities]]
name = "stable_state_source_markers"
enabled = true

[[capabilities]]
name = "overlay_semantics_mount"
enabled = true

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_typed_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[capabilities]]
name = "llm_streaming_two_display_modes_only"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-contract"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[dependencies]]
name = "ui/overlay"
kind = "overlay-shell"

[[dependencies]]
name = "ui/button"
kind = "close-action-slot"

[agent_contract]
schema = "ui.dialog.agent-contract.v1"
intent = "overlay.interaction"
action = "open-close"
streaming = "optional"
fallback = "snapshot"
output_state = "verified"
state_axes = ["open_state"]
source_axes = ["open_mode", "open_change_source"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.dialog.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["overlay.interaction"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["open-close"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["open", "closed"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["controlled", "uncontrolled"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["required", "optional"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-stream-mode"
values = ["streaming", "snapshot"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-stream-fallback"
values = ["streaming", "snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-output-status"
values = ["draft", "verified", "commit-ready"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::dialog::resolve_open_state_contract",
  "typed_agent_contract_from_logic::resolve_agent_contract",
  "typed_render_mount_from_view::render_content",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
