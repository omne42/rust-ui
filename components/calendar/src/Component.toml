schema_version = "1"

[component]
name = "Calendar"
crate = "ui-calendar"

[[inputs]]
name = "year"
ty = "i32"
default = "required"
controlled = false

[[inputs]]
name = "month"
ty = "u8"
default = "required"
controlled = false

[[inputs]]
name = "tone"
ty = "CalendarTone"
default = "CalendarTone::Default"
controlled = false

[[inputs]]
name = "first_weekday"
ty = "CalendarFirstWeekday"
default = "CalendarFirstWeekday::Sunday"
controlled = false

[[inputs]]
name = "is_show_outside_days"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "show_outside_days"
ty = "Option<bool>"
default = "None (legacy)"
controlled = false

[[inputs]]
name = "selected_day"
ty = "Option<u8>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected_day"
ty = "Option<u8>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_day_change"
ty = "Option<Callback<Option<u8>>>"
default = "None"
controlled = false

[[inputs]]
name = "on_day_press"
ty = "Option<Callback<u8>>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "CalendarMotion"
default = "CalendarMotion::default()"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "on_selected_day_change"
ty = "Callback<Option<u8>>"
scope = "component-event"

[[outputs]]
name = "on_day_press"
ty = "Callback<u8>"
scope = "component-event"

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-selected-day + data-selected-day-mode + data-selected-day-source + data-motion-source + data-ui-* + role + aria-label + lang + dir"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_selected_day"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "motion_contract_with_non_wasm_noop"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"
