[package]
name = "ui-calendar"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/mod.rs"

[features]
default = []

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
ui-headless = { path = "../../crates/ui-headless" }
ui-logic-calendar = { path = "../../crates/ui-logic-calendar" }
ui-theme = { path = "../../crates/ui-theme" }
serde = { version = "1.0", features = ["derive"] }
