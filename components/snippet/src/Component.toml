schema_version = "1"

[component]
name = "Snippet"
crate = "ui-snippet"

[[inputs]]
name = "text"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_copyable"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "copyable"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "copy_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "copied_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "copy_aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "copy_error_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_copied"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "copied"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_copied"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_copied_change"
ty = "Option<leptos::prelude::Callback<bool>>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "SnippetMotion"
default = "SnippetMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-copy + data-copy-status + data-copyable-source + data-copied-source + data-multiline + data-empty + data-label + data-copyable + data-copy-actionable + data-copied-label + data-custom-class + data-loading + data-copy-error + data-retry-available + aria-busy + lang + dir"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "structured_state_markers"
enabled = true

[[capabilities]]
name = "controlled_uncontrolled_state_pair"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "motion_contract_with_non_wasm_noop"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "ui-observability"
kind = "runtime-observability"
