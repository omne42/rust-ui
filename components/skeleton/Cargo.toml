[package]
name = "ui-skeleton"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/mod.rs"

[features]
default = []
skeleton-group = []

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
ui-state-primitives = { path = "../../crates/ui-state-primitives" }
serde = { version = "1.0", features = ["derive"] }
