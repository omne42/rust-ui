[package]
name = "ui-carousel"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/mod.rs"

[features]
default = ["web"]
web = ["leptos/csr", "ui-headless/web"]
ssr = ["leptos/ssr", "ui-headless/ssr"]

[dependencies]
leptos = { version = "0.8.15", default-features = false }
ui-headless = { path = "../../crates/ui-headless", default-features = false }
ui-motion = { path = "../../crates/ui-motion" }
ui-state-primitives = { path = "../../crates/ui-state-primitives" }
ui-visual-primitive = { path = "../../crates/ui-visual-primitive" }
