schema_version = "1"

[component]
name = "DropZone"
crate = "ui-drop-zone"
rbi = "drop_zone.rbi"

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "Option<DropZoneMotion>"
default = "None"
controlled = false

[[inputs]]
name = "on_drop_files"
ty = "Option<Callback<Vec<DroppedFile>>>"
default = "None"
controlled = false

[[inputs]]
name = "children"
ty = "Children"
default = "required"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-drag-phase + data-hovered + data-focused + data-focus-visible + data-drop-target + data-disabled + data-disabled-source + data-motion-source + data-custom-motion + data-aria-source + data-has-label + role + aria-* + lang + dir"
scope = "root/zone"

[[outputs]]
name = "on_drop_files"
ty = "Callback<Vec<DroppedFile>>"
scope = "drop-and-paste-event"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-config-policy + data-ui-output-status + data-ui-motion-source + data-ui-aria-source + data-ui-capability-*"
scope = "root"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_typed_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[capabilities]]
name = "drag_and_paste_file_collection"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "motion_contract_attach"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-and-interaction"

[[dependencies]]
name = "ui-motion"
kind = "motion-driver"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[agent_contract]
schema = "ui.drop_zone.agent-contract.v1"
intent = "file-ingestion"
action = "await-input|capture-drop|blocked"
streaming = "optional"
fallback = "snapshot"
output_state = "verified"
state_axes = ["drag_phase", "is_disabled"]
source_axes = ["disabled_source", "motion_source", "aria_source"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.drop_zone.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["file-ingestion"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["await-input", "capture-drop", "blocked"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["idle", "dragging", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["is_disabled", "disabled", "default"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::drop_zone::resolve_labels",
  "typed_agent_contract_from_logic::resolve_agent_contract",
  "typed_render_mount_from_view::DropZone",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
