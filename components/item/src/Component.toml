schema_version = "1"

[component]
name = "Item"
crate = "ui-item"
rbi = "item.rbi"

[[inputs]]
name = "variant"
ty = "Option<ItemVariant>"
default = "None"
controlled = false

[[inputs]]
name = "size"
ty = "Option<ItemSize>"
default = "None"
controlled = false

[[inputs]]
name = "media_variant"
ty = "Option<ItemMediaVariant>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "children"
ty = "leptos::children::Children"
default = "required"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "role + data-slot + data-variant + data-size + data-variant-source + data-size-source + lang + dir"

[[outputs]]
name = "agent-contract"
ty = "data-ui-schema + data-ui-intent + data-ui-action + data-ui-state-* + data-ui-source-*"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"

[agent_contract]
schema = "ui.item.agent-contract.v1"
intent = "collection-item"
output_mode_axis = ["streaming", "snapshot"]
action_axis = ["render"]
state_axes = ["variant", "size"]
source_axes = ["variant_source", "size_source"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.item.agent-contract.v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["collection-item"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render"]

[[agent_contract_markers]]
name = "streaming_policy"
attr = "data-ui-streaming-policy"
values = ["optional"]

[[agent_contract_markers]]
name = "streaming_fallback"
attr = "data-ui-streaming-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["streaming", "snapshot"]

[[agent_contract_markers]]
name = "output_mode"
attr = "data-ui-output-mode"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["validated"]

[[agent_contract_markers]]
name = "state_variant"
attr = "data-ui-state-variant"
values = ["default", "outline", "muted"]

[[agent_contract_markers]]
name = "state_size"
attr = "data-ui-state-size"
values = ["default", "sm"]

[[agent_contract_markers]]
name = "source_variant"
attr = "data-ui-source-variant"
values = ["default", "prop"]

[[agent_contract_markers]]
name = "source_size"
attr = "data-ui-source-size"
values = ["default", "prop"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_logic::derive_item_render_state",
  "typed_agent_contract_from_protocol::agent_data_attrs",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]

[[capabilities]]
name = "streaming_optional_with_snapshot_fallback_and_output_status_markers"
enabled = true
