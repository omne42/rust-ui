schema_version = "1"

[component]
name = "ColorField"
crate = "ui-color-field"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "placeholder"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "Option<bool>"
default = "None (legacy)"
controlled = false

[[inputs]]
name = "value"
ty = "Option<Signal<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "default_value"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "on_value_change"
ty = "Option<Callback<Option<String>>>"
default = "None"
controlled = true

[[inputs]]
name = "is_preview_visible"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "show_preview"
ty = "Option<bool>"
default = "None (legacy)"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "on_value_change"
ty = "Callback<Option<String>>"
scope = "component-event"

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-disabled + data-has-value + data-valid + data-invalid + data-has-preview + data-label-source + data-placeholder-source + data-aria-source + data-class-source + role + aria-* + lang + dir"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_value"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "ui-clear-button"
kind = "composed-control"

[[dependencies]]
name = "ui-color-swatch"
kind = "composed-control"
