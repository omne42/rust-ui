schema_version = "1"

[component]
name = "CheckboxGroup"
crate = "ui-checkbox-group"

[[inputs]]
name = "id"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "label"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "error"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_invalid"
ty = "Signal<bool>"
default = "Signal::derive(|| false)"
controlled = true

[[inputs]]
name = "is_required"
ty = "Signal<bool>"
default = "Signal::derive(|| false)"
controlled = true

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "motion"
ty = "CheckboxGroupMotion"
default = "CheckboxGroupMotion::default()"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "aria_describedby"
ty = "Signal<Option<String>>"
default = "Signal::derive(|| None)"
controlled = true

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "data-state-source"
ty = "semantic-props"
scope = "root-attribute"

[[outputs]]
name = "data-motion-phase"
ty = "active | inactive"
scope = "root-attribute"

[[outputs]]
name = "data-ui-schema"
ty = "ui.checkbox-group.agent-contract"
scope = "root-attribute"

[[outputs]]
name = "data-ui-schema-version"
ty = "v1"
scope = "root-attribute"

[[outputs]]
name = "data-ui-intent"
ty = "group-selection"
scope = "root-attribute"

[[outputs]]
name = "data-ui-action"
ty = "render-semantic | render-semantic-with-error"
scope = "root-attribute"

[[outputs]]
name = "data-ui-state"
ty = "enabled-valid | enabled-invalid | disabled-valid | disabled-invalid"
scope = "root-attribute"

[[outputs]]
name = "data-ui-source"
ty = "semantic-props"
scope = "root-attribute"

[[outputs]]
name = "data-ui-state-source"
ty = "semantic-props"
scope = "root-attribute"

[[outputs]]
name = "data-ui-config-policy"
ty = "whitelist"
scope = "root-attribute"

[[outputs]]
name = "data-ui-stream-support"
ty = "optional"
scope = "root-attribute"

[[outputs]]
name = "data-ui-stream-fallback"
ty = "snapshot"
scope = "root-attribute"

[[outputs]]
name = "data-ui-output-status"
ty = "draft | verified | commit-ready"
scope = "root-attribute"

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "agent_contract_schema_typed_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[agent_contract_markers]]
name = "schema"
schema = "ui.checkbox-group.agent-contract.v1"

[[agent_contract_markers]]
name = "schema_name"
attr = "data-ui-schema"
values = ["ui.checkbox-group.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["group-selection"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render-semantic", "render-semantic-with-error"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = [
  "enabled-valid",
  "enabled-invalid",
  "disabled-valid",
  "disabled-invalid",
]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["semantic-props"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["optional"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["draft", "verified", "commit-ready"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["CheckboxGroup", "render_description_block", "render_error_block"]
blocked = ["inner_html", "<script", "javascript:"]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-theme"
kind = "motion-token-source"
