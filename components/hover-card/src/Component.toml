schema_version = "1"

[component]
name = "HoverCard"
crate = "ui-hover-card"
rbi = "hover_card.rbi"

[[inputs]]
name = "content"
ty = "leptos::children::ViewFn"
default = "required"
controlled = false

[[inputs]]
name = "children"
ty = "leptos::children::Children"
default = "required"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "placement"
ty = "ui_headless::PopoverPlacement"
default = "PopoverPlacement::default()"
controlled = false

[[inputs]]
name = "is_open"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "open"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<leptos::prelude::Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "open_delay_ms"
ty = "Option<u64>"
default = "None"
controlled = false

[[inputs]]
name = "close_delay_ms"
ty = "Option<u64>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "crate::HoverCardMotion"
default = "HoverCardMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "id"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-state + data-open + data-closed + data-disabled + data-enabled + data-class-source + data-motion-source + data-delay-source + data-id-source + data-open-mode + data-open-value-source + data-open-intent-source + data-placement + role + aria-* + lang + dir"
scope = "root/trigger/panel"

[[outputs]]
name = "on_open_change"
ty = "Option<Callback<bool>>"
scope = "open-state"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-config-policy + data-ui-output-status + data-ui-capability-*"
scope = "root"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_open_state"
enabled = true

[[capabilities]]
name = "popover_measure_and_positioning"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_render_policy"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-and-interaction"

[[dependencies]]
name = "ui-motion"
kind = "motion-driver"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[agent_contract]
schema = "ui.hover_card.agent-contract.v1"
intent = "overlay-hint"
action = "open|close"
streaming = "optional"
fallback = "snapshot"
output_state = "verified"
state_axes = ["is_open", "is_disabled"]
source_axes = ["open_mode"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.hover_card.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["overlay-hint"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["open", "close"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["open", "closed"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["controlled", "uncontrolled"]

[[agent_contract_markers]]
name = "config_policy"
attr = "data-ui-config-policy"
values = ["whitelist"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::hover_card::resolve_state",
  "typed_agent_contract_from_logic::resolve_agent_contract",
  "typed_render_mount_from_view::HoverCard",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
