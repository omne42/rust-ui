schema_version = "1"

[component]
name = "AvatarGroup"
crate = "ui-avatar-group"

[[inputs]]
name = "items"
ty = "Vec<AvatarGroupItem>"
default = "required"
controlled = false

[[inputs]]
name = "max"
ty = "Option<usize>"
default = "None"
controlled = false

[[inputs]]
name = "size"
ty = "AvatarSize"
default = "AvatarSize::Md"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[capabilities]]
name = "overflow_indicator"
enabled = true

[[capabilities]]
name = "a11y_i18n_l10n"
enabled = true

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "whitelist_render_policy_no_script_injection"
enabled = true

[[capabilities]]
name = "streaming_optional_with_snapshot_fallback_and_output_status_markers"
enabled = true

[[dependencies]]
name = "ui-avatar"
kind = "component-composition"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "leptos"
kind = "render-runtime"
