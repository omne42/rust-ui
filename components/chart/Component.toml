[component]
id = "ui-chart"
name = "Chart"
kind = "snapshot"
manifest_version = 1

[projection]
rbi = "Component.rbi"

[files]
mod_rs = "src/mod.rs"
logic_rs = "src/logic.rs"
styles_rs = "src/styles.rs"
view_rs = "src/view.rs"
motion_rs = "src/motion.rs"
protocol_rs = "src/protocol.rs"

[capabilities]
snapshot = true
streaming = false
spec_builder = false
motion_runtime = true
context_compression_manifest = true
rbi_signature_projection = true

[streaming_policy]
required = false
fallback = "snapshot"
owner = "upstream"

[a11y]
role = "region"
supports_lang_dir = true

[markers]
required = [
  "data-slot",
  "data-kind",
  "data-state",
  "data-empty",
  "data-has-points",
  "data-disabled",
  "data-enabled",
  "data-show-grid",
  "data-controlled",
  "data-uncontrolled",
  "data-active-index",
  "data-active-value-source",
  "data-active-interaction-source",
  "data-class-source",
  "data-custom-class",
  "data-motion-source",
  "data-custom-motion",
  "data-ui-schema",
  "data-ui-schema-version",
  "data-ui-intent",
  "data-ui-action",
  "data-ui-kind",
  "data-ui-state",
  "data-ui-source",
  "data-ui-active-value-source",
  "data-ui-interaction-source",
  "data-ui-motion-source",
  "data-ui-stream-support",
  "data-ui-stream-fallback",
  "data-ui-stream-mode",
  "data-ui-output-status",
  "data-ui-config-policy",
]

[agent_contract]
schema = "ui.chart.agent-contract/v1"
fields = [
  "kind",
  "state",
  "active_index",
  "source.active_value",
  "source.interaction",
  "source.motion",
]

[agent_contract_markers]
schema = "data-ui-schema"
schema_version = "data-ui-schema-version"
intent = "data-ui-intent"
action = "data-ui-action"
state = "data-ui-state"
source = "data-ui-source"

[agent_contract_whitelist]
allowed = [
  "logic::normalize_input_boundary(...)",
  "logic::derive_state_from_boundary(...)",
  "logic::resolve_agent_contract(...)",
  "use_chart(...)",
  "motion::attach_motion(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]
