[package]
name = "ui-toast"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/mod.rs"

[features]
default = []

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
ui-headless = { path = "../../crates/ui-headless" }
ui-motion = { path = "../../crates/ui-motion" }
ui-observability = { path = "../../crates/ui-observability" }
ui-state-primitives = { path = "../../crates/ui-state-primitives" }
ui-theme = { path = "../../crates/ui-theme" }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.85"
web-sys = { version = "0.3.85", features = ["HtmlElement", "CssStyleDeclaration"] }
