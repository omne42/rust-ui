schema_version = "1"

[component]
name = "FormField"
crate = "ui-form-field"
rbi = "form_field.rbi"

[[inputs]]
name = "is_selected"
ty = "Option<leptos::prelude::Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_selected"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_selected_change"
ty = "Option<leptos::prelude::Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_invalid"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "tone"
ty = "FormFieldTone"
default = "FormFieldTone::default()"
controlled = false

[[inputs]]
name = "indicator_variant"
ty = "FormFieldIndicatorVariant"
default = "FormFieldIndicatorVariant::default()"
controlled = false

[[inputs]]
name = "indicator_placement"
ty = "FormFieldIndicatorPlacement"
default = "FormFieldIndicatorPlacement::default()"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "error_message"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-state + data-selected-control-mode + data-default-selected-source + data-selected-change-source + aria-* + lang + dir"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "ui-checkbox"
kind = "indicator-control"

[agent_contract]
schema = "ui.form_field.agent-contract.v1"
intent = "selection-control"
action = "render-snapshot"
streaming = "optional"
fallback = "snapshot"
output_state = "verified"
state_axes = ["selection_state"]
source_axes = ["selected_control_mode"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.form_field.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["selection-control"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render-snapshot"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = [
  "unselected",
  "selected",
  "disabled",
  "invalid",
  "selected-disabled",
  "selected-invalid",
  "invalid-disabled",
]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["controlled", "uncontrolled"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["optional"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::radio::resolve_checked_axis",
  "typed_agent_contract_from_logic::resolve_agent_contract_attrs",
  "typed_render_mount_from_view",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
