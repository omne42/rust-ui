schema_version = "1"

[component]
id = "ui-kbd"
name = "Kbd"
crate = "ui-kbd"
kind = "snapshot"
manifest_version = 1

[projection]
rbi = "kbd.rbi"

[files]
mod_rs = "mod.rs"
logic_rs = "logic.rs"
styles_rs = "styles.rs"
view_rs = "view.rs"
protocol_rs = "protocol.rs"

[[inputs]]
name = "size"
ty = "Option<KbdSize>"
default = "None"
controlled = false

[[inputs]]
name = "keys"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "children"
ty = "Children"
default = "required"
controlled = false

[capabilities]
snapshot = true
streaming = false
spec_builder = false
motion_runtime = false
context_compression_manifest = true
rbi_signature_projection = true

[streaming_policy]
required = false
fallback = "snapshot"
owner = "upstream"

[markers]
required = [
  "data-slot",
  "data-size",
  "data-state",
  "data-keys",
  "data-custom-class",
]

[agent_contract]
schema = "ui.kbd.agent-contract/v1"
fields = ["intent", "action", "state", "source"]
intent = "display"
action = "snapshot_render"

[output_state]
default = "verified"
allowed = ["draft", "verified", "committable"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["logic::resolve_view_model", "view::Kbd", "view::render_keys_slot"]
blocked = ["inner_html", "dangerously_set_inner_html", "<script", "javascript:"]
