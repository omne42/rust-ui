schema_version = "1"

[component]
name = "Checkbox"
crate = "ui-checkbox"

[[inputs]]
name = "is_checked"
ty = "Option<ReadSignal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "checked"
ty = "Option<ReadSignal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "on_checked_change"
ty = "Option<WriteSignal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "set_checked"
ty = "Option<WriteSignal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_checked"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "on_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = false

[[inputs]]
name = "variant"
ty = "CheckboxVariant"
default = "CheckboxVariant::Default"
controlled = false

[[inputs]]
name = "size"
ty = "CheckboxSize"
default = "CheckboxSize::Default"
controlled = false

[[inputs]]
name = "motion"
ty = "CheckboxMotion"
default = "CheckboxMotion::default()"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-* + aria-* + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-state-source + data-ui-checked-source + data-ui-handler-source + data-ui-motion-source + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[agent_contract]]
schema = "ui.checkbox.agent-contract.v1"
intent = "selection.toggle"
action = "press.toggle"
state_axes = ["checked", "unchecked", "disabled"]
source_axes = [
  "ui_state_primitives::checkbox::resolve_state",
  "checked-source",
  "handler-source",
  "motion-source",
  "stream-support",
  "stream-fallback",
  "output-status",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.checkbox.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["selection.toggle"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["press.toggle"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["checked", "unchecked", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["optional"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["children()", "render_checkbox_indicator()", "render_checkbox_indicator_icon()"]
blocked = ["inner_html", "<script", "javascript:"]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"
