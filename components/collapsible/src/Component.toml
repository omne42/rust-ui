schema_version = "1"

[component]
name = "Collapsible"
crate = "ui-collapsible"
rbi = "collapsible.rbi"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "title"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "open"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "motion"
ty = "CollapsibleMotion"
default = "CollapsibleMotion::default()"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-state + data-open-mode + data-open-value-source + data-open-change-source + data-label-source + data-class-source + data-motion-source + data-custom-class + data-custom-motion + data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-output-status + data-ui-stream-support + data-ui-stream-fallback + data-ui-stream-mode + data-ui-state-source + data-ui-motion-source + data-ui-open-value-source + data-ui-open-change-source + data-ui-config-policy + role + aria-* + lang + dir"
scope = "root-trigger-panel"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent-contract-markers"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_boundary"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "streaming_optional_fallback_snapshot"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[agent_contract]]
schema = "ui.collapsible.agent-contract.v1"
intent = "collapsible.interaction"
action = "toggle"
state_axes = ["open", "closed", "disabled"]
source_axes = [
  "state-primitives",
  "data-ui-state-source",
  "data-ui-motion-source",
  "data-ui-open-value-source",
  "data-ui-open-change-source",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.collapsible.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["collapsible.interaction"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["toggle"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["open", "closed", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["unsupported"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["snapshot"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "logic::normalize_id_base(...)",
  "logic::resolve_title(...)",
  "logic::resolve_aria_label(...)",
  "logic::resolve_state(...)",
  "logic::resolve_agent_contract(...)",
  "collapsible_motion::attach_indicator_motion(...)",
  "collapsible_motion::attach_panel_motion(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]

[streaming_policy]
term_scope = "llm-output-rendering"
defined_modes = ["streaming", "snapshot"]
required = false
owner = "upstream"
fallback = "snapshot"
default = "snapshot"
