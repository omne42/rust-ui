schema_version = "1"

[component]
name = "Label"
crate = "ui-label"

[[inputs]]
name = "text"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "for_id"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_required"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "emphasis"
ty = "LabelEmphasis"
default = "LabelEmphasis::default()"
controlled = false

[[inputs]]
name = "required_indicator"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "LabelMotion"
default = "LabelMotion::default()"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-emphasis + data-state + data-required + data-disabled + data-has-for + data-label-source + data-indicator-source + data-custom-class + data-class-source + data-motion-source + aria-disabled + lang + dir"

[[outputs]]
name = "agent-contract-schema"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status + data-ui-label-source + data-ui-indicator-source + data-ui-class-source + data-ui-motion-source"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "structured_state_markers"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[capabilities]]
name = "motion_contract_with_non_wasm_noop"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[agent_contract]
schema = "ui.label.agent-contract.v1"
intent = "form-label"
output_mode_axis = ["snapshot"]
action_axis = ["render-snapshot"]
state_axes = ["required", "optional"]
source_axes = ["default", "custom"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.label.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["v1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["form-label"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["render-snapshot"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["required", "optional"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["optional"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "typed_state_from_ui_state_primitives::label::resolve_state",
  "typed_agent_contract_from_logic::resolve_agent_contract_attrs",
  "typed_render_mount_from_view",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
