schema_version = "1"

[component]
name = "LabeledValue"
crate = "ui-labeled-value"

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "value"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "orientation"
ty = "LabeledValueOrientation"
default = "LabeledValueOrientation::default()"
controlled = false

[[inputs]]
name = "tone"
ty = "LabeledValueTone"
default = "LabeledValueTone::default()"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "LabeledValueMotion"
default = "LabeledValueMotion::default()"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-* + aria-* + role"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "snapshot_rendering"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"

[[agent_contract]]
schema = "labeled_value.v1"
intent = "display"
action = "snapshot_render"
state_axes = ["orientation", "tone", "has_description", "source_markers"]
source_axes = [
  "props.orientation",
  "props.tone",
  "props.label/value/aria_label/class_name",
  "ui_state_primitives::labeled_value::resolve_state",
]

[[agent_contract_markers]]
name = "orientation"
attr = "data-orientation"
values = ["inline", "stacked"]

[[agent_contract_markers]]
name = "tone"
attr = "data-tone"
values = ["default", "subtle", "strong"]

[[agent_contract_markers]]
name = "state"
attr = "data-state"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "source"
attr = "data-label-source/data-value-source/data-aria-source/data-class-source"
values = ["default", "custom"]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["labeled_value.v1"]

[[agent_contract_markers]]
name = "output_mode"
attr = "data-output-mode"
values = ["snapshot"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-output-status"
values = ["validated"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "normalized_text_props(label/value/description/aria_label/class_name/lang)",
  "typed_state_from_ui_state_primitives::labeled_value::resolve_state",
  "typed_semantics_from_ui_headless::use_labeled_value",
]
blocked = [
  "inner_html",
  "dangerously_set_inner_html",
  "<script",
  "javascript:",
]
