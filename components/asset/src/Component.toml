schema_version = "1"

[component]
name = "Asset"
crate = "ui-asset"

[[inputs]]
name = "variant"
ty = "Option<AssetVariant>"
default = "None"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "size"
ty = "Option<AssetSize>"
default = "None"
controlled = false

[[inputs]]
name = "is_selected"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_focused"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "Option<AssetMotion>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "children"
ty = "Option<leptos::children::Children>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-slot + data-variant + data-size + data-state + data-selected + data-focused + data-*-source + data-ui-schema + data-ui-intent + data-ui-action + data-ui-state + data-ui-*-source + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status + lang + dir"

[[outputs]]
name = "agent-contract-schema"
ty = "data-ui-schema + data-ui-intent + data-ui-action + data-ui-state + data-ui-selection-source + data-ui-focus-source + data-ui-label-source + data-ui-class-source + data-ui-content-source + data-ui-motion-source + data-ui-stream-support + data-ui-stream-fallback + data-ui-output-status"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "schema_protocol_versioning"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "streaming_optional_snapshot_fallback"
enabled = true

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-thumbnail"
kind = "visual-primitive"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"
