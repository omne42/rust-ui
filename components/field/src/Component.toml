schema_version = "1"

[component]
id = "ui-field"
name = "Field"
crate = "ui-field"
kind = "snapshot"
manifest_version = 1

[projection]
rbi = "field.rbi"

[files]
mod_rs = "mod.rs"
logic_rs = "logic.rs"
styles_rs = "styles.rs"
view_rs = "view.rs"
motion_rs = "motion.rs"
protocol_rs = "protocol.rs"
group_mod_rs = "group/mod.rs"
group_logic_rs = "group/logic.rs"
group_styles_rs = "group/styles.rs"
group_view_rs = "group/view.rs"
group_protocol_rs = "group/protocol.rs"

[capabilities]
snapshot = true
streaming = false
spec_builder = false
motion_runtime = true
context_compression_manifest = true
rbi_signature_projection = true

[streaming_policy]
required = false
fallback = "snapshot"
owner = "upstream"

[llm_render_modes]
allowed = ["streaming", "snapshot"]
default = "snapshot"

[markers]
required = [
  "data-slot",
  "data-state",
  "data-orientation",
  "data-tone",
  "data-required",
  "data-disabled",
  "data-invalid",
  "data-required-source",
  "data-disabled-source",
  "data-invalid-source",
  "data-motion-source",
  "data-aria-source",
  "data-error-source",
  "data-class-source",
  "data-ui-schema",
  "data-ui-schema-version",
  "data-ui-intent",
  "data-ui-action",
  "data-ui-state",
  "data-ui-source",
  "data-ui-source-required",
  "data-ui-source-disabled",
  "data-ui-source-invalid",
  "data-ui-source-motion",
  "data-ui-source-aria",
  "data-ui-source-error",
  "data-ui-source-class",
  "data-ui-stream-mode",
  "data-ui-stream-support",
  "data-ui-stream-fallback",
  "data-ui-output-mode",
  "data-ui-output-status",
]

[agent_contract]
schema = "ui.field.agent-contract/v1"
fields = [
  "intent",
  "action",
  "state",
  "source",
  "source.required",
  "source.disabled",
  "source.invalid",
  "source.motion",
  "source.aria",
  "source.error",
  "source.class",
  "stream.mode",
  "stream.support",
  "stream.fallback",
  "output.mode",
  "output.status",
]
intent = "form-field"
action = "snapshot_render"

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "logic::resolve_content",
  "logic::resolve_state",
  "logic::resolve_agent_contract",
  "view::Field",
  "group::logic::resolve_agent_contract",
  "group::view::FieldGroup",
  "motion::attach_motion",
]
blocked = ["inner_html", "dangerously_set_inner_html", "<script", "javascript:"]

[output_state]
default = "verified"
allowed = ["draft", "verified", "committable"]
