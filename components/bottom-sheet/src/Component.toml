schema_version = "1"

[component]
name = "BottomSheet"
crate = "ui-bottom-sheet"

[[inputs]]
name = "open"
ty = "Signal<bool>"
default = "required"
controlled = true

[[inputs]]
name = "on_close"
ty = "OnPress"
default = "required"
controlled = false

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "title"
ty = "String"
default = "\"Bottom sheet\""
controlled = false

[[inputs]]
name = "description"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "footer"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "motion"
ty = "BottomSheetMotion"
default = "BottomSheetMotion::default()"
controlled = false

[[inputs]]
name = "is_handle_visible"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_close_button_visible"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "close_label"
ty = "Option<&'static str>"
default = "None"
controlled = false

[[inputs]]
name = "is_detached"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "bottom_inset_px"
ty = "Option<f64>"
default = "None"
controlled = false

[[inputs]]
name = "is_dismissable"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "is_keyboard_dismiss_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "show_handle"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "show_close_button"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "detached"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_exit_complete"
ty = "Option<Callback<()>>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-* + aria-* + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-output-status + data-ui-stream-support + data-ui-stream-mode + data-ui-stream-fallback + data-ui-render-policy"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[agent_contract]]
schema = "ui.bottom-sheet.agent-contract.v1"
intent = "overlay.bottom-sheet"
action = "dismiss-any-input | dismiss-pointer-only | non-dismissible"
state_axes = ["closed", "open-basic", "open-with-description", "open-with-footer", "open-with-description-footer", "open-detached"]
source_axes = [
  "state-primitives/default-motion",
  "state-primitives/custom-motion",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.bottom-sheet.agent-contract"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["overlay.bottom-sheet"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["dismiss-any-input", "dismiss-pointer-only", "non-dismissible"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = [
  "closed",
  "open-basic",
  "open-with-description",
  "open-with-footer",
  "open-with-description-footer",
  "open-detached",
]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["state-primitives/default-motion", "state-primitives/custom-motion"]

[[agent_contract_markers]]
name = "output_status"
attr = "data-ui-output-status"
values = ["verified"]

[[agent_contract_markers]]
name = "stream_support"
attr = "data-ui-stream-support"
values = ["optional"]

[[agent_contract_markers]]
name = "stream_mode"
attr = "data-ui-stream-mode"
values = ["streaming", "snapshot"]

[[agent_contract_markers]]
name = "stream_fallback"
attr = "data-ui-stream-fallback"
values = ["snapshot"]

[[agent_contract_markers]]
name = "render_policy"
attr = "data-ui-render-policy"
values = ["typed-only"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["children()", "render_bottom_sheet_content(input.clone())"]
blocked = ["inner_html", "<script", "javascript:"]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-motion"
kind = "animation-engine"
