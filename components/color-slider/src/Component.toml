schema_version = "1"

[component]
name = "ColorSlider"
crate = "ui-color-slider"

[[inputs]]
name = "id_base"
ty = "String"
default = "required"
controlled = false

[[inputs]]
name = "channel"
ty = "ColorSliderChannel"
default = "ColorSliderChannel::default()"
controlled = false

[[inputs]]
name = "label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "value"
ty = "Option<Signal<f64>>"
default = "None"
controlled = true

[[inputs]]
name = "default_value"
ty = "Option<f64>"
default = "None"
controlled = false

[[inputs]]
name = "on_value_change"
ty = "Option<Callback<f64>>"
default = "None"
controlled = true

[[inputs]]
name = "min"
ty = "f64"
default = "f64::NAN"
controlled = false

[[inputs]]
name = "max"
ty = "f64"
default = "f64::NAN"
controlled = false

[[inputs]]
name = "step"
ty = "f64"
default = "f64::NAN"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "bool"
default = "false"
controlled = false

[[inputs]]
name = "motion"
ty = "ColorSliderMotion"
default = "ColorSliderMotion::default()"
controlled = false

[[inputs]]
name = "show_value_label"
ty = "bool"
default = "true"
controlled = false

[[inputs]]
name = "track_start_color"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "track_end_color"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<ui_headless::A11yDirection>"
default = "None"
controlled = false

[[outputs]]
name = "on_value_change"
ty = "Callback<f64>"
scope = "component-event"

[[outputs]]
name = "semantic-markers"
ty = "data-state + data-disabled + data-focused + data-focus-visible + data-channel + data-value + data-value-percent + data-control-mode + data-value-source + data-default-value-source + data-value-change-source + data-disabled-source + role + aria-* + lang + dir"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-stream-support + data-ui-stream-fallback + data-ui-stream-mode + data-ui-output-status + data-ui-intent + data-ui-action + data-ui-source + data-ui-state"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "controlled_and_uncontrolled_value"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[capabilities]]
name = "agent_contract_whitelist_boundary"
enabled = true

[[capabilities]]
name = "snapshot_only_stream_mode"
enabled = true

[[capabilities]]
name = "token_first_styles"
enabled = true

[[capabilities]]
name = "i18n_locale_direction_context"
enabled = true

[[agent_contract]]
schema = "ui.color-slider.agent-contract.v1"
intent = "adjust-color-channel"
action = "idle|focus|press"
state_axes = ["active", "disabled"]
source_axes = [
  "data-ui-source",
  "data-control-mode",
  "data-value-source",
  "data-default-value-source",
  "data-value-change-source",
  "data-disabled-source",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.color-slider.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["adjust-color-channel"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["idle", "focus", "press"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["active", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["on_value_change", "none"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = [
  "render_header(...)",
  "render_control(...)",
  "render_input(...)",
  "render_track()",
  "logic::resolve_state(...)",
  "logic::resolve_agent_contract(...)",
]
blocked = ["inner_html", "<script", "javascript:", "eval("]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-motion"
kind = "motion-contract"

[[dependencies]]
name = "ui-theme"
kind = "token-source"

[[dependencies]]
name = "serde"
kind = "protocol-serialization"
