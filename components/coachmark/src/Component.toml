schema_version = "1"

[component]
name = "Coachmark"
crate = "ui-coachmark"

[[inputs]]
name = "variant"
ty = "CoachmarkVariant"
default = "Default::default()"
controlled = false

[[inputs]]
name = "aria_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "is_disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "disabled"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "placement"
ty = "PopoverPlacement"
default = "Default::default()"
controlled = false

[[inputs]]
name = "motion"
ty = "CoachmarkMotion"
default = "CoachmarkMotion::default()"
controlled = false

[[inputs]]
name = "open"
ty = "Option<Signal<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "default_open"
ty = "Option<bool>"
default = "None"
controlled = false

[[inputs]]
name = "on_open_change"
ty = "Option<Callback<bool>>"
default = "None"
controlled = true

[[inputs]]
name = "title"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "class_name"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "current_step"
ty = "Option<usize>"
default = "None"
controlled = false

[[inputs]]
name = "total_steps"
ty = "Option<usize>"
default = "None"
controlled = false

[[inputs]]
name = "primary_cta"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "secondary_cta"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "on_primary"
ty = "Option<OnPress>"
default = "None"
controlled = false

[[inputs]]
name = "on_secondary"
ty = "Option<OnPress>"
default = "None"
controlled = false

[[inputs]]
name = "shortcut_key"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "modifier_keys"
ty = "Vec<String>"
default = "Vec::new()"
controlled = false

[[inputs]]
name = "asset_variant"
ty = "Option<CoachmarkAssetVariant>"
default = "None"
controlled = false

[[inputs]]
name = "asset_label"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "asset_src"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "asset_alt"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "lang"
ty = "Option<String>"
default = "None"
controlled = false

[[inputs]]
name = "dir"
ty = "Option<A11yDirection>"
default = "None"
controlled = false

[[inputs]]
name = "actions"
ty = "Option<ViewFn>"
default = "None"
controlled = false

[[outputs]]
name = "semantic-markers"
ty = "data-* + aria-* + lang + dir + data-ui-*"

[[outputs]]
name = "agent-contract-markers"
ty = "data-ui-schema + data-ui-schema-version + data-ui-intent + data-ui-action + data-ui-state + data-ui-source + data-ui-state-source + data-ui-action-source + data-ui-render-path + data-ui-output-status"

[[capabilities]]
name = "context_compression_manifest"
enabled = true

[[capabilities]]
name = "rbi_signature_projection"
enabled = true

[[capabilities]]
name = "agent_contract_schema_markers"
enabled = true

[[agent_contract]]
schema = "ui.coachmark.agent-contract.v1"
intent = "guided-tour"
action = "read-guidance | navigate-step"
state_axes = ["open", "closed", "disabled"]
source_axes = [
  "ui-state-primitives::coachmark::resolve_state",
  "internal",
  "external",
]

[[agent_contract_markers]]
name = "schema"
attr = "data-ui-schema"
values = ["ui.coachmark.agent-contract.v1"]

[[agent_contract_markers]]
name = "schema_version"
attr = "data-ui-schema-version"
values = ["1"]

[[agent_contract_markers]]
name = "intent"
attr = "data-ui-intent"
values = ["guided-tour"]

[[agent_contract_markers]]
name = "action"
attr = "data-ui-action"
values = ["read-guidance", "navigate-step"]

[[agent_contract_markers]]
name = "state"
attr = "data-ui-state"
values = ["open", "closed", "disabled"]

[[agent_contract_markers]]
name = "source"
attr = "data-ui-source"
values = ["internal", "external"]

[[agent_contract_markers]]
name = "state_source"
attr = "data-ui-state-source"
values = ["ui-state-primitives::coachmark::resolve_state"]

[[agent_contract_markers]]
name = "action_source"
attr = "data-ui-action-source"
values = ["content-body", "footer-actions"]

[[agent_contract_whitelist]]
name = "render_path"
allowed = ["children()", "render_content_fragment()", "render_footer_fragment()", "actions.run()"]
blocked = ["inner_html", "<script", "javascript:", "eval("]

[[dependencies]]
name = "leptos"
kind = "render-runtime"

[[dependencies]]
name = "ui-headless"
kind = "a11y-interaction"

[[dependencies]]
name = "ui-state-primitives"
kind = "state-normalization"

[[dependencies]]
name = "ui-components"
kind = "component-composition"
