[package]
name = "ui-coachmark"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
component-coachmark = []

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
ui-headless = { path = "../../crates/ui-headless" }
ui = { path = "../../crates/ui", default-features = false, features = ["component-coachmark"] }
ui-state-primitives = { path = "../../crates/ui-state-primitives" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
ui-test-support = { path = "../../crates/ui-test-support" }
