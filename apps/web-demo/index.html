<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-demo</title>

    <link data-trunk rel="css" href="app.css" />
    <link data-trunk rel="css" href="dev-overrides.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0b0b;
        color: #f5f5f5;
      }

      #boot .boot-card {
        width: min(520px, 100%);
        padding: 16px 18px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.55);
      }

      #boot .boot-title {
        margin: 0 0 10px 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      #boot .boot-body {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        opacity: 0.9;
      }

      #boot pre {
        margin: 12px 0 0 0;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        overflow: auto;
        max-height: 40vh;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-card">
        <p class="boot-title">Loading web-demo…</p>
        <p class="boot-body">
          This demo is CSR-only. If this takes too long or stays blank, check the browser console.
        </p>
        <pre data-boot-details hidden></pre>
      </div>
    </div>

    <script>
      (() => {
        const boot = document.getElementById("boot");
        if (!boot) return;

        const details = boot.querySelector("[data-boot-details]");

        const set_details = (label, value) => {
          if (!details) return;
          details.hidden = false;
          const text =
            typeof value === "string"
              ? value
              : value instanceof Error
                ? value.stack || value.message
                : JSON.stringify(value, null, 2);
          details.textContent = `${label}\n\n${text}`;
        };

        window.addEventListener(
          "TrunkApplicationStarted",
          () => {
            boot.remove();
          },
          { once: true }
        );

        const original_console_error = console.error.bind(console);
        console.error = (...args) => {
          try {
            const text = args
              .map((arg) => {
                if (typeof arg === "string") return arg;
                if (arg instanceof Error) return arg.stack || arg.message;
                try {
                  return JSON.stringify(arg, null, 2);
                } catch {
                  return String(arg);
                }
              })
              .join(" ");
            set_details("Console error", text);
          } catch {
            // ignore
          }
          original_console_error(...args);
        };

        window.addEventListener("error", (ev) => {
          set_details("Runtime error", ev?.error ?? ev?.message ?? ev);
        });

        window.addEventListener("unhandledrejection", (ev) => {
          set_details("Unhandled promise rejection", ev?.reason ?? ev);
        });
      })();
    </script>
  </body>
</html>
