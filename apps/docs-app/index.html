<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rust-ui docs</title>

    <link data-trunk rel="css" href="app.css" />
    <link data-trunk rel="css" href="dev-overrides.css" />
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <style>
      body {
        margin: 0;
        color: #0f172a;
        background: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #ssg-shell {
        padding: 24px;
      }

      .shell-wrap {
        max-width: 1100px;
        margin: 0 auto;
      }

      .shell-title {
        margin: 0;
        font-size: 20px;
      }

      .shell-subtitle {
        margin: 6px 0 0 0;
        font-size: 13px;
        color: #475569;
      }

      .shell-main {
        margin-top: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: #ffffff;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .shell-main h2 {
        margin: 0 0 8px 0;
        font-size: 15px;
      }

      .shell-main p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }

      #boot {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        border-radius: 10px;
        border: 1px solid rgba(15, 23, 42, 0.16);
        background: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        padding: 10px 12px;
        font-size: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      #boot pre {
        margin: 8px 0 0 0;
        max-height: 30vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="ssg-shell" data-ssg-shell>
      <main class="shell-wrap">
        <h1 class="shell-title">rust-ui docs</h1>
        <p class="shell-subtitle">Static first-screen shell. Interactive docs mount after the WASM runtime starts.</p>

        <section class="shell-main" aria-live="polite">
          <h2>Loading documentation pages</h2>
          <p>
            This docs site is rendered as CSR at runtime. The shell is pre-rendered to avoid blank first paint while assets load.
          </p>
        </section>
      </main>
    </div>

    <div id="boot" aria-live="polite" aria-atomic="true">
      Loading rust-ui docs runtime...
      <pre data-boot-details hidden></pre>
    </div>

    <script>
      (() => {
        const shell = document.querySelector("[data-ssg-shell]");
        const boot = document.getElementById("boot");
        const details = boot?.querySelector("[data-boot-details]");

        const appendDetails = (label, value) => {
          if (!details) return;
          details.hidden = false;
          const text =
            typeof value === "string"
              ? value
              : value instanceof Error
                ? value.stack || value.message
                : JSON.stringify(value, null, 2);
          const line = `${label}\n\n${text}`;
          const prev = details.textContent?.trim();
          details.textContent = prev ? `${prev}\n\n---\n\n${line}` : line;
        };

        window.addEventListener(
          "TrunkApplicationStarted",
          () => {
            shell?.remove();
            boot?.remove();
          },
          { once: true }
        );

        const originalConsoleError = console.error.bind(console);
        console.error = (...args) => {
          try {
            const text = args
              .map((arg) => {
                if (typeof arg === "string") return arg;
                if (arg instanceof Error) return arg.stack || arg.message;
                try {
                  return JSON.stringify(arg, null, 2);
                } catch {
                  return String(arg);
                }
              })
              .join(" ");
            appendDetails("Console error", text);
          } catch {
            // ignore
          }
          originalConsoleError(...args);
        };

        window.addEventListener("error", (ev) => {
          appendDetails("Runtime error", ev?.error ?? ev?.message ?? ev);
        });

        window.addEventListener("unhandledrejection", (ev) => {
          appendDetails("Unhandled promise rejection", ev?.reason ?? ev);
        });
      })();
    </script>
  </body>
</html>
