[package]
name = "docs-app"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
pulldown-cmark = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ui = { path = "../../crates/ui", default-features = false, features = ["inject-css", "all-components"] }
ui-layout = { path = "../../crates/ui-layout", default-features = false, features = ["inject-css", "all-components"] }
ui-headless = { path = "../../crates/ui-headless" }

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
gloo-events = "0.2.0"
js-sys = "0.3.85"
web-sys = { version = "0.3.85", features = ["Attr", "Document", "DomRect", "Element", "EventTarget", "KeyboardEvent", "Location", "NamedNodeMap", "Navigator", "Storage", "Window"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(erase_components)"]
