[package]
name = "docs-app"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
pulldown-cmark = "0.13.0"
ui-components = { path = "../../crates/ui-components" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-events = "0.2.0"
js-sys = "0.3.85"
web-sys = { version = "0.3.85", features = ["Document", "Element", "KeyboardEvent", "Location", "Navigator", "Window"] }
