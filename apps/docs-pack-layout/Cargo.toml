[package]
name = "docs-pack-layout"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8.15", default-features = false, features = ["csr"] }
ui = { path = "../../crates/ui", default-features = false, features = ["inject-css"] }
ui-layout = { path = "../../crates/ui-layout", default-features = false, features = ["inject-css", "component-card", "component-flex", "component-heading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.85", features = ["Location", "Window"] }
